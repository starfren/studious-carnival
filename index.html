<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Nexus Notes</h1>
    </header>
    <div id="toolbar">
        <button id="textModeBtn">Text Mode</button>
        <button id="drawModeBtn">Drawing Mode</button>
        <button id="mediaModeBtn">Media Mode</button>
        <input type="color" id="colorPicker" value="#000000" title="Color">
        <label for="lineWidthPicker" style="margin-left: 10px;">Width:</label>
        <input type="range" id="lineWidthPicker" min="1" max="30" value="2" title="Line Width">
        <button id="clearCanvasBtn" style="margin-left: 10px;">Clear Canvas</button>
    </div>
    <main id="content-area">
        <canvas id="noteCanvas"></canvas>
    </main>
    <script src="script.js"></script>
</body>
</html>
